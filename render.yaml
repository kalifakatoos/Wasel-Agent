services:
  - type: web
    name: wasel-agents
    env: node
    region: frankfurt
    plan: starter
    rootDir: mini-services/wasel-agents
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3020
      - key: DATABASE_URL
        sync: false
