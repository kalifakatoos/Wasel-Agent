services:
  - type: web
    name: wasel-nalut-app
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        value: "file:./db/custom.db"

  - type: web
    name: wasel-agents
    env: node
    region: frankfurt
    plan: starter
    rootDir: mini-services/wasel-agents
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3020
      - key: DATABASE_URL
        value: "file:../db/custom.db"
